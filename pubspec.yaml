name: eleveur_app
description: Application de gestion d'élevage d'oiseaux (canaris, chardonnerets, perruches, perroquets, colombidés, exotiques)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend / données
  supabase_flutter: ^2.5.0

  # État / architecture
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Auth sociale
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # UI / utilitaires
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  fl_chart: ^0.68.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0

  # Pilotage local du contrôleur Breeding Control (appel HTTP direct sur le
  # réseau WiFi local, indépendant de Supabase)
  http: ^1.2.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
