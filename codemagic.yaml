workflows:
  android-workflow:
    name: Nidus - Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build APK (release, non signé)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
